name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned so a new ruff release can't start failing CI on its own.
      - name: Install ruff
        run: python -m pip install ruff==0.17.3

      - name: Lint
        run: ruff check . && ruff format --check .

  test:
    name: Python ${{ matrix.python-version }} on Windows
    # Windows, because that's the platform the game targets (winsound/MCI
    # audio, the PyInstaller .exe), and its runners can open real Tk
    # windows for the UI tests without a virtual display.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README promises, and the one it's
        # developed on.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The game itself needs nothing beyond the standard library; these
      # are only test tooling. The annotate plugin reports each failing
      # test by file and line on the run's summary page.
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest pytest-github-actions-annotate-failures

      - name: Run the test suite
        run: python -m pytest tests -q -rfE --tb=short
